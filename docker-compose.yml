networks:
  rustdesk-net:
    driver: bridge

x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  hbbs:
    image: ${RUSTDESK_SERVER_IMAGE:-rustdesk/rustdesk-server:latest}
    container_name: rustdesk-hbbs
    restart: unless-stopped
    command: hbbs -r ${RUSTDESK_RELAY_SERVER:-localhost:21117} ${HBBS_EXTRA_ARGS:--k _}
    volumes:
      - ./data/server:/root
    ports:
      - "21115:21115"
      - "21116:21116"
      - "21116:21116/udp"
      - "21118:21118"
    networks:
      - rustdesk-net
    logging: *default-logging
    labels:
      - "com.centurylinklabs.watchtower.enable=true"

  hbbr:
    image: ${RUSTDESK_SERVER_IMAGE:-rustdesk/rustdesk-server:latest}
    container_name: rustdesk-hbbr
    restart: unless-stopped
    command: hbbr ${HBBR_EXTRA_ARGS:--k _}
    volumes:
      - ./data/server:/root
    ports:
      - "21117:21117"
      - "21119:21119"
    networks:
      - rustdesk-net
    logging: *default-logging
    labels:
      - "com.centurylinklabs.watchtower.enable=true"

  rustdesk-api:
    image: ${API_IMAGE:-ghcr.io/echolunet/rustdesk-api:latest}
    container_name: rustdesk-api
    restart: unless-stopped
    depends_on:
      - hbbs
      - hbbr
    ports:
      - "${API_PORT:-21114}:21114"
    environment:
      - TZ=${TZ:-Asia/Shanghai}
      - APP_HOST=0.0.0.0
      - APP_PORT=21114
      - GIN_MODE=${GIN_MODE:-release}
      - DATA_DIR=/app/data
      - WEBCLIENT_DIR=/app/webclient
      - DB_TYPE=${DB_TYPE:-sqlite}
      - DB_DSN=${DB_DSN:-}
      - JWT_SECRET=${JWT_SECRET:-}
      - JWT_EXPIRE_HOURS=${JWT_EXPIRE_HOURS:-168}
      - ADMIN_INIT_USER=${ADMIN_INIT_USER:-admin}
      - ADMIN_INIT_PASSWORD=${ADMIN_INIT_PASSWORD:-}
      - RUSTDESK_ID_SERVER=${RUSTDESK_ID_SERVER:-}
      - RUSTDESK_RELAY_SERVER=${RUSTDESK_RELAY_SERVER:-}
      - RUSTDESK_API_SERVER=${RUSTDESK_API_SERVER:-}
      - RUSTDESK_KEY_FILE=/data/server/id_ed25519.pub
      - RUSTDESK_KEY=${RUSTDESK_KEY:-}
      - HBBS_WS_TARGET=http://hbbs:21118
      - HBBR_WS_TARGET=http://hbbr:21119
      - ALLOW_ALL_DEVICES_FOR_USERS=${ALLOW_ALL_DEVICES_FOR_USERS:-false}
      - MAX_PEER_ONE_AB=${MAX_PEER_ONE_AB:-0}
      - CLIENT_STRATEGY_ENABLED=${CLIENT_STRATEGY_ENABLED:-true}
      - CLIENT_DEFAULT_IMAGE_QUALITY=${CLIENT_DEFAULT_IMAGE_QUALITY:-custom}
      - CLIENT_DEFAULT_FPS=${CLIENT_DEFAULT_FPS:-60}
      - CLIENT_DEFAULT_QUALITY=${CLIENT_DEFAULT_QUALITY:-75}
      - CLIENT_DEFAULT_CODEC=${CLIENT_DEFAULT_CODEC:-auto}
      - CLIENT_ENABLE_HWCODEC=${CLIENT_ENABLE_HWCODEC:-true}
      - CLIENT_ENABLE_AUDIO=${CLIENT_ENABLE_AUDIO:-true}
      - CLIENT_ENABLE_CLIPBOARD=${CLIENT_ENABLE_CLIPBOARD:-true}
      - CLIENT_ENABLE_FILE_TRANSFER=${CLIENT_ENABLE_FILE_TRANSFER:-true}
      - CLIENT_ENABLE_KEYBOARD=${CLIENT_ENABLE_KEYBOARD:-true}
      - CLIENT_ENABLE_TUNNEL=${CLIENT_ENABLE_TUNNEL:-true}
      - CLIENT_ENABLE_REMOTE_RESTART=${CLIENT_ENABLE_REMOTE_RESTART:-true}
      - CLIENT_ENABLE_RECORD_SESSION=${CLIENT_ENABLE_RECORD_SESSION:-false}
      - CLIENT_DIRECT_SERVER=${CLIENT_DIRECT_SERVER:-false}
      - CLIENT_VERIFICATION_METHOD=${CLIENT_VERIFICATION_METHOD:-}
      - CLIENT_APPROVE_MODE=${CLIENT_APPROVE_MODE:-}
    volumes:
      - ./data/server:/data/server:ro
      - ./data/api:/app/data
      - ./data/webclient:/app/webclient
    networks:
      - rustdesk-net
    logging: *default-logging
    labels:
      - "com.centurylinklabs.watchtower.enable=false"
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:21114/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  nginx:
    image: nginx:alpine
    container_name: rustdesk-nginx
    profiles: ["nginx"]
    restart: unless-stopped
    depends_on:
      - rustdesk-api
      - hbbs
      - hbbr
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/rustdesk.conf:/etc/nginx/conf.d/default.conf:ro
      - ./nginx/ssl:/etc/nginx/ssl:ro
    networks:
      - rustdesk-net
    logging: *default-logging

  watchtower:
    image: containrrr/watchtower:latest
    container_name: rustdesk-watchtower
    profiles: ["auto-update"]
    restart: unless-stopped
    command: --label-enable --cleanup --interval ${WATCHTOWER_INTERVAL:-86400}
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    networks:
      - rustdesk-net
    logging: *default-logging
